<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remlin Control Plane</title>
<meta name="description" content="Remlin merchant console — interactive HTML prototype.">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Remlin — obsidian liquid glass, lit in blue
   Tokens follow Design.md; blue is the single sanctioned hue.
   ============================================================ */
:root{
  --canvas:#050506;
  --t1:#ffffff;
  --t2:rgba(255,255,255,.70);
  --t3:rgba(255,255,255,.50);
  --t4:rgba(255,255,255,.38);
  --line:rgba(255,255,255,.11);
  --line-soft:rgba(255,255,255,.065);
  --line-strong:rgba(255,255,255,.20);

  --blue:#2f9dff;
  --blue-hi:#4fb3ff;
  --blue-ice:#8fd4f7;
  --cyan:#00bfff;
  --blue-glass:linear-gradient(180deg, rgba(47,157,255,.24), rgba(47,157,255,.07));
  --blue-rim:rgba(79,179,255,.42);
  --blue-cta:linear-gradient(180deg,#2f9dff,#4fb3ff 34%,#8fd4f7 66%,#dff4fb);
  --blue-halo:0 0 0 4px rgba(120,180,255,.16), 0 0 34px rgba(70,160,255,.55), 0 10px 30px rgba(20,90,200,.45);

  --silver-glass:linear-gradient(150deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
  --light:linear-gradient(180deg,#ffffff,#cfd3da);

  --ok-b:rgba(61,220,132,.42);  --ok-f:rgba(20,90,55,.35);  --ok-t:#7ff0b0;
  --warn-b:rgba(240,180,60,.45); --warn-f:rgba(96,66,10,.40); --warn-t:#ffcf6b;
  --bad-b:rgba(244,72,58,.45);  --bad-f:rgba(96,20,14,.40);  --bad-t:#ff9d92;
  --info-b:rgba(79,179,255,.40); --info-f:rgba(47,157,255,.14); --info-t:#cfe9ff;
  --neu-b:rgba(255,255,255,.16); --neu-f:rgba(255,255,255,.07); --neu-t:rgba(255,255,255,.72);
  --caveat:#d9b160;

  --sh-card:0 40px 100px rgba(0,0,0,.70), inset 0 1px 0 rgba(255,255,255,.16);
  --sh-inner:0 24px 60px rgba(0,0,0,.60), inset 0 1px 0 rgba(255,255,255,.16);
  --sh-ctrl:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
  --sh-light:0 14px 34px rgba(0,0,0,.60), inset 0 1px 0 rgba(255,255,255,.95);
  --sh-sunk:inset 0 3px 8px rgba(0,0,0,.80), inset 0 -1px 0 rgba(255,255,255,.16);

  --ease:cubic-bezier(.4,0,.2,1);
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --side-w:264px;
  --side-w-c:84px;
  --blur:30px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--t1)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input::placeholder,textarea::placeholder{color:var(--t4)}
a{color:rgba(255,255,255,.86);text-decoration:none}
a:hover{color:#fff}
p{margin:0;text-wrap:pretty}
h1,h2,h3,h4{margin:0}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;border-radius:10px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
@keyframes sheen{0%,100%{opacity:.55}50%{opacity:.85}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .dot.live,.bloom.b1{animation:none!important}
}

/* ---------- canvas: dot grid + corner spotlights ---------- */
.canvas{position:fixed;inset:0;background:var(--canvas);overflow:hidden;pointer-events:none;z-index:0}
.canvas::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:26px 26px;opacity:.6}
.canvas::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 70% at 50% -8%,rgba(255,255,255,.07),transparent 58%)}
.bloom{position:absolute;border-radius:50%;pointer-events:none}
.bloom.b1{top:-26%;left:-8%;width:62vw;height:62vw;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);filter:blur(60px);animation:sheen 9s ease-in-out infinite}
.bloom.b2{top:-18%;right:-12%;width:52vw;height:52vw;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);filter:blur(70px)}
.bloom.b3{bottom:-32%;right:-6%;width:58vw;height:58vw;background:radial-gradient(circle,rgba(47,157,255,.16),transparent 72%);filter:blur(80px)}
.bloom.b4{bottom:-24%;left:14%;width:40vw;height:40vw;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 65%);filter:blur(70px)}
/* per-page light, so no two pages are lit identically */
.pagelight{position:absolute;border-radius:50%;pointer-events:none;filter:blur(70px);transition:all .6s var(--ease)}

/* ---------- app shell ---------- */
.app{position:relative;z-index:1;display:flex;height:100vh;height:100dvh}
.sidebar{
  width:var(--side-w);flex:0 0 auto;display:flex;flex-direction:column;min-height:0;
  background:
    radial-gradient(110% 40% at 0% 0%,rgba(255,255,255,.10),transparent 60%),
    linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.015) 55%,rgba(255,255,255,.04));
  backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);
  border-right:1px solid var(--line);
  box-shadow:30px 0 70px rgba(0,0,0,.6);
  transition:width .28s var(--ease), transform .28s var(--ease);
  z-index:30;
}
.app.collapsed .sidebar{width:var(--side-w-c)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 16px 18px 18px;border-bottom:1px solid var(--line-soft)}
.brand-link{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{width:40px;height:40px;flex:0 0 auto;border-radius:50%;filter:drop-shadow(0 0 14px rgba(47,157,255,.35))}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--t3);letter-spacing:.12em;line-height:1.4;white-space:nowrap}
.icon-btn{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;color:var(--t2);border:1px solid transparent;transition:all .18s ease}
.icon-btn:hover{background:rgba(255,255,255,.09);color:#fff;border-color:var(--line)}
.app.collapsed .brand{justify-content:center;gap:0;padding:20px 0 18px;flex-direction:column;gap:12px}
.app.collapsed .brand-link{flex:0 0 auto}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}

.nav{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.nav::-webkit-scrollbar{width:0}
.nav-sec{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--t4);padding:0 12px 8px;white-space:nowrap}
.nav-rule{height:1px;background:var(--line);margin:0 18px 8px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:12px;height:42px;padding:0 13px;border-radius:13px;
  color:var(--t2);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:all .18s ease;white-space:nowrap;width:100%;text-align:left
}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item svg{flex:0 0 auto;color:rgba(255,255,255,.62)}
.nav-item:hover svg{color:#fff}
.nav-item.active{background:var(--blue-glass);border-color:var(--blue-rim);color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14)}
.nav-item.active svg{color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-13px;top:11px;width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--cyan);box-shadow:0 0 12px rgba(0,191,255,.8)}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:700;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));color:#fff}
.app.collapsed .nav{padding:14px 10px}
.app.collapsed .nav-item{justify-content:center;gap:0;padding:11px 0}
.app.collapsed .nav-item.active::before{left:-10px}

.side-foot{padding:14px 12px 16px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
.sys{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;color:var(--t3);padding:2px 6px 4px;white-space:nowrap}
.who{border-radius:14px;padding:10px 12px;background:rgba(0,0,0,.35);border:1px solid var(--line);box-shadow:var(--sh-sunk);min-width:0}
.who-k{font-size:10.5px;letter-spacing:.12em;color:var(--t4)}
.who-v{font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:36px;border-radius:12px;font-size:12.5px;font-weight:650;color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:all .18s ease;white-space:nowrap}
.foot-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.foot-btn.signout:hover{background:rgba(255,90,90,.14);color:#ffb4b4;border-color:rgba(255,90,90,.3)}
.foot-btn.duty-on{color:#fff}
.app.collapsed .side-foot{align-items:center;padding:14px 10px 16px}
.app.collapsed .foot-btn{width:44px;padding:0}
.app.collapsed .sys{justify-content:center;padding:4px 0}

.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block}
.dot.ok{background:#3ddc84;box-shadow:0 0 10px rgba(61,220,132,.9)}
.dot.blue{background:var(--blue-hi);box-shadow:0 0 10px rgba(79,179,255,.9)}
.dot.off{background:rgba(255,255,255,.35)}
.dot.live{animation:pulseDot 2.2s ease-in-out infinite}

/* ---------- main column ---------- */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{
  position:relative;z-index:20;flex:0 0 auto;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;
  background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.01));
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-bottom:1px solid var(--line-soft)
}
.menu-btn{display:none}
.live-pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px 0 11px;border-radius:99px;font-size:11.5px;font-weight:750;letter-spacing:.14em;background:var(--silver-glass);border:1px solid rgba(255,255,255,.26);box-shadow:var(--sh-ctrl)}
.route{font-size:11.5px;letter-spacing:.12em;color:var(--t3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.route b{color:var(--blue-hi);font-weight:600}
.tb-spacer{flex:1}
.search{
  display:flex;align-items:center;gap:9px;width:300px;padding:5px 5px 5px 13px;border-radius:12px;
  background:linear-gradient(180deg,#000000,#0b0b0d 42%,#1d1e21 78%,#2a2b2f);box-shadow:var(--sh-sunk);border:1px solid rgba(255,255,255,.06)
}
.search svg{color:var(--t3);flex:0 0 auto}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13px}
.search .go{width:32px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--t2);transition:all .18s ease}
.search .go:hover{background:rgba(255,255,255,.16);color:#fff}
.clock{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--t3);letter-spacing:.06em;white-space:nowrap}
.bell{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:var(--sh-ctrl);color:var(--t2);transition:all .18s ease}
.bell:hover{background:rgba(255,255,255,.14);color:#fff}
.bell i{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
.profile{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:var(--sh-ctrl);transition:all .18s ease;color:var(--t2)}
.profile:hover{background:rgba(255,255,255,.12);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(150deg,#1b4a8a,#071225);border:1px solid rgba(255,255,255,.2)}

.content{flex:1 1 auto;min-height:0;overflow:auto;position:relative}
.view{max-width:1220px;margin:0 auto;padding:30px 30px 64px;display:flex;flex-direction:column;gap:22px;animation:rise .28s var(--ease)}
.view.wide{max-width:none}

/* ---------- type ---------- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--t3)}
.h1{font-size:clamp(24px,2.2vw,30px);font-weight:750;letter-spacing:-.02em;line-height:1.15}
.lede{font-size:14px;color:var(--t2);max-width:720px;line-height:1.6}
.h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.h3{font-size:14.5px;font-weight:700}
.meta{font-size:12px;color:var(--t3);letter-spacing:.04em}
.mono{font-family:var(--mono);letter-spacing:0}
.muted{color:var(--t3)}
.t2{color:var(--t2)}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line-soft)}
.page-head .txt{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 420px}
.page-head .side{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title-row{display:flex;align-items:center;gap:12px}
.title-row svg{color:var(--blue-hi)}

.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.sec-head b{font-weight:700;display:flex;align-items:center;gap:8px}
.sec-head b svg{color:var(--blue-hi)}
.sec-head span{font-size:12px;color:var(--t3);letter-spacing:.04em}

/* ---------- liquid glass surfaces ---------- */
.card{
  position:relative;border-radius:22px;border:1px solid var(--line);
  background:
    radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.09),transparent 46%),
    radial-gradient(90% 70% at 100% 100%,rgba(255,255,255,.05),transparent 52%),
    linear-gradient(160deg,rgba(26,26,29,.90),rgba(13,13,14,.94) 55%,rgba(4,4,5,.96));
  box-shadow:var(--sh-card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  min-width:0
}
.card.aside{background:
    radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.09),transparent 46%),
    linear-gradient(160deg,rgba(28,28,31,.90),rgba(8,8,9,.96))}
.card.stat{border-radius:20px;background:
    radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.10),transparent 46%),
    linear-gradient(160deg,rgba(28,28,31,.90),rgba(8,8,9,.96));box-shadow:var(--sh-inner)}
.card.chart{background:
    radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.09),transparent 46%),
    radial-gradient(90% 70% at 100% 0%,rgba(255,255,255,.06),transparent 50%),
    linear-gradient(160deg,rgba(24,24,26,.90),rgba(0,0,0,.97))}
.card.inner{border-radius:18px;box-shadow:var(--sh-inner);background:
    radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.06),transparent 46%),
    linear-gradient(160deg,rgba(32,32,35,.86),rgba(17,17,19,.90))}
.card.deep{background:
    radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.05),transparent 46%),
    linear-gradient(160deg,rgba(15,15,16,.94),rgba(0,0,0,.98))}
.card.banner{border-radius:20px;background:
    radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.13),transparent 46%),
    linear-gradient(160deg,rgba(30,30,38,.86),rgba(5,5,6,.97))}
.card.blue{border-color:var(--blue-rim);background:
    radial-gradient(120% 90% at 0% 0%,rgba(79,179,255,.20),transparent 50%),
    radial-gradient(90% 70% at 100% 100%,rgba(47,157,255,.08),transparent 52%),
    linear-gradient(160deg,rgba(12,26,48,.92),rgba(5,10,20,.96) 55%,rgba(2,4,8,.97))}
.card.okc{border-color:var(--ok-b);background:
    radial-gradient(120% 90% at 0% 0%,rgba(61,220,132,.16),transparent 50%),
    linear-gradient(160deg,rgba(14,34,25,.92),rgba(4,8,6,.97))}
.card.warnc{border-color:var(--warn-b);background:
    radial-gradient(120% 90% at 0% 0%,rgba(240,180,60,.13),transparent 50%),
    linear-gradient(160deg,rgba(34,27,14,.90),rgba(6,5,3,.97))}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card{background-color:rgba(14,14,16,.98)}
}
.pad{padding:24px}
.pad-s{padding:18px 20px}
.card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-soft)}
.card-head .h3{display:flex;align-items:center;gap:9px}
.card-head .h3 svg{color:var(--blue-hi)}
.card-link{font-size:12px;color:var(--t3);display:inline-flex;align-items:center;gap:4px;letter-spacing:.04em;transition:color .18s ease;white-space:nowrap}
.card-link:hover{color:#fff}

/* ---------- grids ---------- */
.g{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);align-items:start}
.split.stretch{align-items:stretch}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}

/* ---------- stat card ---------- */
.stat{padding:18px 20px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:all .18s ease}
button.stat:hover{border-color:var(--line-strong)}
.stat.sel{border-color:var(--blue-rim);background:
    radial-gradient(120% 80% at 0% 0%,rgba(79,179,255,.18),transparent 50%),
    linear-gradient(160deg,rgba(14,28,50,.92),rgba(4,8,14,.96))}
.stat-k{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-k svg{flex:0 0 auto;color:rgba(255,255,255,.55)}
.stat-k.blue,.stat-k.blue svg{color:var(--blue-hi)}
.stat-v{font-size:34px;font-weight:750;letter-spacing:-.02em;line-height:1.05;display:flex;align-items:baseline;gap:3px}
.stat-v small{font-size:16px;font-weight:650;color:var(--t3)}
.stat-v.blue{color:var(--blue-hi);text-shadow:0 0 22px rgba(79,179,255,.45)}
.stat-s{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.stat-s.ok{color:var(--ok-t)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:13px;font-size:13px;font-weight:650;white-space:nowrap;transition:all .18s ease;border:1px solid transparent}
.btn.sm{height:32px;padding:0 12px;border-radius:11px;font-size:12.5px}
.btn.glass{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);box-shadow:var(--sh-ctrl);color:rgba(255,255,255,.88)}
.btn.glass:hover{background:rgba(255,255,255,.15);color:#fff}
.btn.ghost{color:var(--t3)}
.btn.ghost:hover{background:rgba(255,255,255,.08);color:#fff}
.btn.light{background:var(--light);color:#08090b;font-weight:750;box-shadow:var(--sh-light)}
.btn.light:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.blue{
  background:var(--blue-cta);color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(10,50,110,.45);
  border:1px solid rgba(255,255,255,.7);box-shadow:var(--blue-halo)
}
.btn.blue:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn[disabled],.btn.disabled{opacity:.45;pointer-events:none}
.btn svg{flex:0 0 auto}

.seg{display:inline-flex;gap:4px;padding:5px;border-radius:13px;background:rgba(0,0,0,.45);border:1px solid var(--line);box-shadow:var(--sh-sunk);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{height:0}
.seg button{flex:0 0 auto;height:30px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.55);border:1px solid transparent;transition:all .2s var(--ease);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:#fff}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.07));border-color:rgba(255,255,255,.20);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.seg.blue button.on{background:var(--blue-glass);border-color:var(--blue-rim)}
.seg .cnt{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.10);color:var(--t2)}

.tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;min-width:0}
.tabs::-webkit-scrollbar{height:0}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 16px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.60);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:all .18s ease;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.10)}
.tab.on{color:#fff;background:var(--blue-glass);border-color:var(--blue-rim);box-shadow:0 8px 24px rgba(0,0,0,.55)}
.tab svg{color:inherit;opacity:.85}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:750;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08))}
.count.red{background:linear-gradient(160deg,#f4483a,#c62212)}
.count.zero{opacity:.45}

.uline{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);overflow-x:auto;scrollbar-width:none}
.uline::-webkit-scrollbar{height:0}
.uline button{position:relative;padding:10px 10px 12px;font-size:13.5px;font-weight:600;color:var(--t3);white-space:nowrap;transition:color .18s ease}
.uline button:hover{color:#fff}
.uline button.on{color:#fff}
.uline button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--blue-hi);box-shadow:0 0 12px rgba(79,179,255,.9)}

.field{display:flex;align-items:center;gap:9px;height:42px;padding:0 13px;border-radius:14px;background:rgba(0,0,0,.40);border:1px solid var(--line);box-shadow:var(--sh-sunk);transition:border-color .18s ease;min-width:0}
.field:focus-within{border-color:var(--blue-rim)}
.field svg{color:var(--t3);flex:0 0 auto}
.field input,.field select{flex:1;min-width:0;background:none;border:0;outline:0;font-size:13.5px;height:100%}
.field select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:18px}
.field select option{background:#111214;color:#fff}
.kbd{font-family:var(--mono);font-size:11px;min-width:22px;height:22px;padding:0 6px;display:inline-grid;place-items:center;border-radius:7px;border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--t2)}
.area{width:100%;min-height:110px;resize:vertical;padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.40);border:1px solid var(--line);box-shadow:var(--sh-sunk);outline:0;font-size:14px;line-height:1.55;transition:border-color .18s ease}
.area:focus{border-color:var(--blue-rim)}
.area-wrap{position:relative}
.area-wrap .mic{position:absolute;right:10px;bottom:12px}
label.lbl{font-size:12px;font-weight:600;color:var(--t2);display:flex;flex-direction:column;gap:7px}
.check{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--t2);cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:5px;border:1px solid var(--line-strong);background:rgba(0,0,0,.4);display:grid;place-items:center;margin:0;transition:all .18s ease}
.check input:checked{background:var(--blue);border-color:var(--blue-hi)}
.check input:checked::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}

/* chips (semantic) */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--neu-b);background:var(--neu-f);color:var(--neu-t);white-space:nowrap}
.chip.ok{border-color:var(--ok-b);background:var(--ok-f);color:var(--ok-t)}
.chip.warn{border-color:var(--warn-b);background:var(--warn-f);color:var(--warn-t)}
.chip.bad{border-color:var(--bad-b);background:var(--bad-f);color:var(--bad-t)}
.chip.info{border-color:var(--info-b);background:var(--info-f);color:var(--info-t)}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:48px 24px}
.empty .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px;color:var(--blue-hi);background:radial-gradient(circle at 30% 20%,rgba(79,179,255,.22),rgba(47,157,255,.05));border:1px solid var(--blue-rim);box-shadow:0 0 30px rgba(47,157,255,.18), inset 0 1px 0 rgba(255,255,255,.2)}
.empty .t{font-size:15px;font-weight:700}
.empty .d{font-size:13.5px;color:var(--t3);max-width:440px;line-height:1.6}
.empty .act{margin-top:10px}
.dashed{border-radius:18px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15);padding:16px 18px;font-size:13.5px;color:var(--t3);text-align:center}
.mono-empty{font-family:var(--mono);font-size:12.5px;color:var(--t3);padding:14px 22px 22px}

/* table */
.tbl-wrap{overflow-x:auto}
.tbl{min-width:880px}
.tr{display:grid;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.055);font-size:13.5px}
.tr:last-child{border-bottom:0}
.tr.th{padding:11px 22px;background:rgba(255,255,255,.05);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--t3)}
.tr:not(.th){transition:background .18s ease;animation:rise .25s var(--ease)}
.tr:not(.th):hover{background:rgba(255,255,255,.035)}
.tr .strong{font-weight:700;color:#fff}
.tr .sku{font-family:var(--mono);color:var(--t3);font-size:12.5px}
.status-sel{appearance:none;-webkit-appearance:none;height:28px;padding:0 26px 0 10px;border-radius:9px;font-size:11.5px;font-weight:700;border:1px solid var(--neu-b);background:var(--neu-f);color:var(--neu-t);cursor:pointer;outline:0;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 12px,calc(100% - 9px) 12px;background-size:4px 4px;background-repeat:no-repeat}
.status-sel option{background:#111214;color:#fff}
.status-sel.ok{border-color:var(--ok-b);background-color:var(--ok-f);color:var(--ok-t)}
.status-sel.warn{border-color:var(--warn-b);background-color:var(--warn-f);color:var(--warn-t)}
.status-sel.bad{border-color:var(--bad-b);background-color:var(--bad-f);color:var(--bad-t)}
.status-sel.info{border-color:var(--info-b);background-color:var(--info-f);color:var(--info-t)}

/* list rows */
.lrow{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line-soft);transition:background .18s ease;width:100%;text-align:left}
.lrow:last-child{border-bottom:0}
button.lrow:hover{background:rgba(255,255,255,.04)}
.lrow .main-t{font-size:14px;font-weight:650}
.lrow .sub-t{font-size:12.5px;color:var(--t3)}
.lrow.locked .main-t{color:var(--t2);font-weight:500}
.lrow .end{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--t3);white-space:nowrap}
.lrow .end svg{transition:transform .2s var(--ease)}
.lrow.open .end svg{transform:rotate(180deg)}
.ring{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);flex:0 0 auto}
.ring.done{border-color:var(--ok-t);background:var(--ok-f);display:grid;place-items:center;color:var(--ok-t)}

.progress{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:var(--sh-sunk)}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(79,179,255,.55),#8fd4f7 70%,#fff);box-shadow:0 0 14px rgba(79,179,255,.7);transition:width .5s var(--ease)}

/* charts */
.plot{position:relative;height:150px;margin-top:14px}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.axis{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.35);margin-top:10px;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--t2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:3px;display:inline-block}
.donut{display:grid;place-items:center;position:relative;width:132px;height:132px;margin:18px auto}
.donut svg{position:absolute;inset:0}
.donut .c{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.donut .n{font-size:22px;font-weight:750;line-height:1}
.donut .l{font-size:10.5px;letter-spacing:.16em;color:var(--t2);font-weight:700}
.kv{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.kv svg{color:var(--t3)}
.kv .v{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--t3);display:flex;gap:18px}
.kv .v b{color:var(--blue-hi);font-weight:600}
.hr{height:1px;background:var(--line-soft)}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;min-height:calc(100dvh - 64px - 60px)}
.inbox .card{display:flex;flex-direction:column;min-height:0}

/* overview bits */
.caveat{border-left:2px solid var(--caveat);padding:2px 0 2px 14px;font-size:13.5px;color:var(--t2);line-height:1.6;max-width:760px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--t2)}
.steps li::marker{color:var(--blue-hi);font-weight:700}
.big-n{font-size:30px;font-weight:800;letter-spacing:-.02em}

/* agent desk */
.block{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.block .desc{font-size:12.5px;color:var(--t3);line-height:1.6}
.block .written{font-size:13.5px;color:var(--t1);white-space:pre-wrap;line-height:1.6;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}

/* feedback */
.req{padding:18px 20px;display:flex;flex-direction:column;gap:8px;animation:rise .25s var(--ease)}

/* setup guide + wizard */
.guide-body{padding:2px 22px 20px 54px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;animation:rise .2s var(--ease)}
.guide-body .t2{font-size:13.5px}
.lrow.locked .ring{opacity:.5}
.ring.done svg{display:block}
.setup-pill{border-color:var(--line)!important;background:rgba(255,255,255,.05);margin-bottom:4px}
.setup-pill .nav-badge{font-family:var(--mono);font-weight:600;background:rgba(47,157,255,.18);color:var(--blue-hi)}
.wiz{max-width:880px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabs.wrap{flex-wrap:wrap;overflow:visible}
.tab.done:not(.on){color:var(--ok-t);border-color:rgba(61,220,132,.30)}
.caveat.blue{border-left-color:var(--blue-hi)}
.fg{display:flex;flex-direction:column;gap:7px;min-width:0}
.fg.full{grid-column:1/-1}
.fk{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--t3)}
.help{font-size:12px;color:var(--t3);line-height:1.55}
.fg.flash .area{border-color:var(--blue-hi);box-shadow:var(--sh-sunk),0 0 0 4px rgba(79,179,255,.18)}
.check input[type=radio]{border-radius:50%}
.check input[type=radio]:checked::after{width:6px;height:6px;border:0;border-radius:50%;background:#fff;transform:none}
.daychip{height:32px;min-width:46px;padding:0 10px;border-radius:10px;font-size:12.5px;font-weight:650;color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:all .18s ease}
.daychip:hover{background:rgba(255,255,255,.12);color:#fff}
.daychip.on{background:var(--bad-f);border-color:var(--bad-b);color:var(--bad-t);text-decoration:line-through}
.msgrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);cursor:pointer;transition:background .18s ease}
.msgrow:hover{background:rgba(255,255,255,.06)}
.msgrow .check{margin-top:2px}
.optcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;transition:all .18s ease}
.optcard:hover{border-color:var(--blue-rim);transform:translateY(-1px)}
.empty-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--blue-hi);background:radial-gradient(circle at 30% 20%,rgba(79,179,255,.22),rgba(47,157,255,.05));border:1px solid var(--blue-rim)}
.qa{display:flex;flex-direction:column;gap:6px}
.qa .q{align-self:flex-start;max-width:80%;padding:10px 14px;border-radius:18px 18px 18px 8px;font-size:13.5px;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line)}
.qa .a{align-self:flex-end;max-width:85%;padding:10px 14px;border-radius:18px 18px 8px 18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;background:radial-gradient(120% 120% at 100% 0%,rgba(79,179,255,.20),transparent 60%),var(--silver-glass);border:1px solid rgba(255,255,255,.26)}
.btn.danger{border-color:var(--bad-b);background:var(--bad-f);color:var(--bad-t)}
.btn.danger:hover{background:rgba(140,30,20,.55);color:#fff}
.btn.glass.on{background:var(--blue-glass);border-color:var(--blue-rim);color:#fff}
@media (max-width:640px){ .guide-body{padding:2px 18px 18px 18px} }

/* toast + modal */
.toaster{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;font-size:13px;color:#fff;
  background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.14),transparent 46%),linear-gradient(160deg,rgba(30,30,38,.92),rgba(5,5,6,.97));
  border:1px solid var(--line-strong);box-shadow:var(--sh-inner);backdrop-filter:blur(20px);animation:rise .22s var(--ease)}
.toast svg{color:var(--blue-hi)}
.onboard{position:fixed;right:24px;bottom:24px;z-index:70;width:min(340px,calc(100vw - 32px));padding:18px;display:flex;flex-direction:column;gap:14px;animation:rise .3s var(--ease)}
.scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:rise .2s var(--ease)}
.modal{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto}
.modal .body{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .body .full{grid-column:1/-1}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line-soft)}
.side-scrim{display:none}

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .search{width:240px}
}
@media (max-width:1080px){
  .split{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .route{display:none}
}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);width:var(--side-w)!important}
  .app.mobile-open .sidebar{transform:none}
  .app.mobile-open .side-scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
  .collapse-btn{display:none!important}
  .menu-btn{display:grid}
  .topbar{padding:0 16px;gap:10px}
  .search{display:none}
  .view{padding:22px 16px 56px;gap:18px}
  .inbox{grid-template-columns:minmax(0,1fr);min-height:0}
  .inbox .thread{min-height:360px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .watch-btn{display:none}
}
@media (max-width:640px){
  .g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock .tm{display:none}
  .profile .chev{display:none}
  .pad{padding:18px}
  .card-head{padding:16px 18px}
  .lrow{padding:14px 18px}
  .stat-v{font-size:28px}
  .modal .body{grid-template-columns:1fr}
  .onboard{right:16px;bottom:16px}
}
@media (max-width:400px){
  .g5,.g4{grid-template-columns:minmax(0,1fr)}
}

/* ============================================================
   Inbox v2 — filter pills + conversations | chat | cart & orders
   ============================================================ */
.content.fill{display:flex;flex-direction:column;overflow:hidden}
.view.fill{flex:1 1 0;min-height:0;max-width:none;width:100%;margin:0;padding:20px 24px 24px;gap:16px}
.view.wide{max-width:none}
[hidden]{display:none!important}

.ib-filters{flex:0 0 auto;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.ib-filters::-webkit-scrollbar{height:0}
.fpill{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--t2);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transition:all .18s ease;white-space:nowrap}
.fpill:hover{color:#fff;border-color:var(--line-strong);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04))}
.fpill.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border-color:rgba(255,255,255,.34);box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.24)}
.fpill .n{min-width:22px;height:22px;padding:0 6px;border-radius:99px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}

.ib{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(320px,31%) minmax(0,1fr) minmax(300px,22%);overflow:hidden;border-radius:24px}
.ib-col{display:flex;flex-direction:column;min-height:0;min-width:0}
.ib-list,.ib-chat{border-right:1px solid var(--line-soft)}

/* conversations */
.ib-h{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px}
.ib-h h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.ib-count{min-width:30px;height:28px;padding:0 9px;border-radius:9px;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.09);border:1px solid var(--line);color:var(--t1)}
.ib-count.sm{min-width:26px;height:24px;font-size:12px;border-radius:8px}
.ib-convs{position:relative;flex:1 1 0;min-height:0;overflow-y:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.cv{display:flex;gap:12px;width:100%;padding:14px;border-radius:18px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);transition:all .18s ease;flex:0 0 auto}
.cv:hover{background:rgba(255,255,255,.065);border-color:var(--line)}
.cv.on{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-color:rgba(255,255,255,.30);box-shadow:0 12px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16)}
.cv-av{position:relative;flex:0 0 auto;width:42px;height:42px}
.av{display:grid;place-items:center;border-radius:50%;font-weight:700;color:#fff;letter-spacing:.02em;background:linear-gradient(150deg,#2c3037,#0f1113);border:1px solid rgba(255,255,255,.16);flex:0 0 auto}
.av.photo{background:radial-gradient(circle at 32% 26%,#ffd58a,#e08a3c 42%,#3d6a3c 100%);border-color:rgba(255,255,255,.35);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cv-ch{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid #121315;font-style:normal}
.cv-b{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.cv-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.cv-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.unread .cv-name::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue-hi);box-shadow:0 0 8px rgba(79,179,255,.9);margin-right:7px;vertical-align:1px}
.cv-time{font-family:var(--mono);font-size:11px;color:var(--t4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.cv-pre{font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-tags{display:flex;gap:6px;flex-wrap:wrap}
.cv-tag{display:inline-flex;align-items:center;height:22px;padding:0 11px;border-radius:99px;font-size:11px;font-weight:650;color:var(--t2);background:rgba(255,255,255,.08);border:1px solid var(--line)}
.cv-tag.warn{color:var(--warn-t);background:var(--warn-f);border-color:var(--warn-b)}
.cv-tag.ok{color:var(--ok-t);background:var(--ok-f);border-color:var(--ok-b)}
.cv-tag.bad{color:var(--bad-t);background:var(--bad-f);border-color:var(--bad-b)}

/* chat */
.ib-chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
.ib-who{min-width:0;flex:1}
.ib-who .nm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-who .st{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t3);margin-top:1px}
.pw{position:relative;flex:0 0 auto}
.menu-b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--t2);background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:var(--sh-ctrl);transition:all .18s ease}
.menu-b:hover,.menu-b[aria-expanded="true"]{background:rgba(255,255,255,.14);color:#fff}
.ib-msgs{flex:1 1 0;min-height:0;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.mrow{display:flex;flex-direction:column;gap:7px;max-width:80%}
.mrow.in{align-self:flex-start;align-items:flex-start}
.mrow.out{align-self:flex-end;align-items:flex-end}
.bub{padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,rgba(14,14,16,.92),rgba(6,6,7,.96));border:1px solid var(--line);box-shadow:var(--sh-inner);font-size:14.5px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.mrow.in .bub{border-radius:18px 18px 18px 6px}
.mrow.out .bub{border-radius:18px 18px 6px 18px}
.bub .bwho{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--t2);margin-bottom:7px}
.bub .bwho .star{font-size:13px;color:#fff}
.mtime{font-family:var(--mono);font-size:11px;color:var(--t4);letter-spacing:.08em}
.mt{white-space:pre-wrap}
.vm{display:flex;flex-direction:column;gap:10px;margin-top:9px}
.vm-l{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3)}
.aud{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px 0 8px;border-radius:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);min-width:250px;box-shadow:var(--sh-sunk)}
.aud-b{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:#fff;transition:background .18s ease;flex:0 0 auto}
.aud-b:hover{background:rgba(255,255,255,.12)}
.aud-tr{position:relative;flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.2);min-width:60px}
.aud-tr i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:#fff}
.aud-tr b{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateY(-50%);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.aud-t{font-family:var(--mono);font-size:12.5px;color:var(--t3);white-space:nowrap}
.aud-t b{font-weight:500;color:#fff}
.aud-v{color:#fff;display:grid;place-items:center}
.vm-tr{padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--t2);line-height:1.55}

/* composer */
.ib-comp{position:relative;flex:0 0 auto;display:flex;flex-direction:column;gap:12px;padding:14px 18px 16px;border-top:1px solid var(--line-soft)}
.ib-input{display:flex;align-items:center;gap:8px;height:50px;padding:0 7px 0 8px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid var(--line-strong);box-shadow:var(--sh-sunk);transition:border-color .18s ease}
.ib-input:focus-within{border-color:var(--blue-rim)}
.ib-input input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:14px;padding:0 4px}
.ib-plus{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--t2);flex:0 0 auto;transition:all .18s ease}
.ib-plus:hover{background:rgba(255,255,255,.12);color:#fff}
.ib-send{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--light);color:#08090b;box-shadow:var(--sh-light);flex:0 0 auto;transition:transform .18s ease,filter .18s ease}
.ib-send:hover{filter:brightness(1.06);transform:translateY(-1px)}
.ib-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:12px;font-size:12.5px;font-weight:650;color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:var(--sh-ctrl);transition:all .18s ease;white-space:nowrap}
.qbtn:hover,.qbtn[aria-expanded="true"]{background:rgba(255,255,255,.14);color:#fff}
.qbtn .star{font-size:13px}
.copilot{margin-left:auto;display:inline-flex;align-items:center;gap:12px;height:40px;padding:0 9px 0 15px;border-radius:14px;font-size:12.5px;font-weight:650;color:rgba(255,255,255,.9);background:rgba(255,255,255,.05);border:1px solid var(--line-strong);box-shadow:var(--sh-ctrl);white-space:nowrap}
.sw{position:relative;width:40px;height:22px;border-radius:99px;background:rgba(0,0,0,.5);border:1px solid var(--line-strong);box-shadow:var(--sh-sunk);transition:all .2s var(--ease);flex:0 0 auto;display:inline-block}
.sw b{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.sw.on{background:var(--blue);border-color:var(--blue-hi);box-shadow:0 0 14px rgba(47,157,255,.5)}
.sw.on b{transform:translateX(18px)}
.cop-bar{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 15px;border-radius:16px;border:1px solid var(--blue-rim);background:var(--blue-glass)}
.cop-bar .star{font-size:16px;color:var(--blue-ice)}
.cop-bar>div{flex:1;min-width:0}
.cop-k{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--blue-ice)}
.cop-t{font-size:13.5px;color:#fff;line-height:1.45;margin-top:2px}

/* popovers */
.pop{position:absolute;z-index:30;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:16px;min-width:230px;background:linear-gradient(160deg,rgba(34,34,38,.985),rgba(12,12,14,.99));border:1px solid var(--line-strong);box-shadow:0 24px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.12);animation:rise .16s var(--ease)}
.pop.menu{right:0;top:calc(100% + 8px)}
.pop.up{left:18px;right:18px;bottom:calc(100% - 4px);max-height:260px;overflow-y:auto}
.pi{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:600;color:var(--t2);text-align:left;transition:background .15s ease,color .15s ease}
.pi:hover{background:rgba(255,255,255,.09);color:#fff}
.pi svg{flex:0 0 auto;color:var(--t3)}
.pi.danger,.pi.danger svg{color:var(--bad-t)}
.pi b{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue-hi);min-width:84px}
.pi .sp{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--t3);white-space:nowrap}
.pi .sn{display:flex;flex-direction:column;gap:1px;min-width:0}
.pi .sn small{font-family:var(--mono);font-size:11px;color:var(--t4);font-weight:500}
.pi-empty{padding:12px;font-size:12.5px;color:var(--t3)}

/* cart & orders */
.ib-side{overflow-y:auto;padding:20px 18px 22px;gap:12px}
.sk{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--t2)}
.cart-empty{border:1px dashed rgba(255,255,255,.17);border-radius:16px;padding:34px 18px;text-align:center;font-size:13.5px;color:var(--t3);background:rgba(255,255,255,.025)}
.cart{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.ci{display:flex;align-items:center;gap:10px;padding:6px 2px}
.ci>div:first-child{flex:1;min-width:0}
.ci-n{font-size:13.5px;font-weight:650}
.ci-s{font-size:11px;color:var(--t3);margin-top:1px}
.ci-p{font-size:13.5px;font-weight:700;white-space:nowrap}
.ci-t{display:flex;justify-content:space-between;padding:10px 2px 4px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--t2)}
.ci-t b{color:#fff;font-size:15px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.sh h3{font-size:14.5px;font-weight:700}
.ocard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,rgba(30,30,33,.72),rgba(12,12,14,.82));border:1px solid var(--line);box-shadow:var(--sh-inner);flex:0 0 auto}
.oc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.oc-ref{font-family:var(--mono);font-size:11.5px;color:var(--t3)}
.ocard .chip{border-radius:99px;height:24px;padding:0 11px}
.oc-mid{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.oc-q{font-family:var(--mono);font-size:12px;color:var(--t3);font-weight:500}
.oc-bot{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--t3)}
.oc-bot b{font-size:14.5px;color:#fff;font-weight:700}
.ocancel{height:36px;border-radius:12px;font-size:12.5px;font-weight:700;color:#ff6a60;background:rgba(110,22,16,.45);border:1px solid var(--bad-b);transition:all .18s ease}
.ocancel:hover{background:rgba(150,30,22,.6);color:#fff}
.ord-none{padding:14px 16px;border-radius:14px;border:1px dashed rgba(255,255,255,.14);font-size:12.5px;color:var(--t3);text-align:center}

/* ============================================================
   Integrations
   ============================================================ */
.int-head{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.eyebrow-pill{display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 15px 0 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--t1);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line-strong);box-shadow:var(--sh-ctrl)}
.eyebrow-pill svg{color:var(--blue-ice)}
.int-h1{font-size:clamp(32px,3.3vw,48px);font-weight:750;letter-spacing:-.03em;line-height:1.08;margin:16px 0 14px}
.int-lede{font-size:15px;color:var(--t2);max-width:700px;line-height:1.65}
.int-sec{display:flex;flex-direction:column;gap:14px}
.int-t{padding-left:4px}
.int-t h2{font-size:14.5px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.int-t p{font-size:12.5px;color:var(--t3);margin-top:3px}
.int-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.icard{display:flex;flex-direction:column;gap:14px;padding:24px;min-height:258px;border-radius:26px;transition:border-color .2s ease,transform .2s ease,opacity .2s ease}
.icard:not(.lock):hover{border-color:var(--line-strong);transform:translateY(-2px)}
.icard.lock{opacity:.5}
.icard.lock .itile{filter:saturate(.5)}
.ic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.itile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.itile.fb{background:rgba(24,119,242,.16);border-color:rgba(24,119,242,.38)}
.itile.ig{background:rgba(214,41,118,.16);border-color:rgba(214,41,118,.38)}
.itile.wa{background:rgba(37,211,102,.14);border-color:rgba(37,211,102,.38);color:#3ddc84}
.itile.web{background:rgba(255,255,255,.08);border-color:var(--line-strong);color:#3ddc84}
.itile.shopify{background:rgba(149,191,71,.16);border-color:rgba(149,191,71,.42)}
.itile.woo{background:rgba(127,84,179,.18);border-color:rgba(127,84,179,.45)}
.itile.csv{background:rgba(47,157,255,.14);border-color:rgba(79,179,255,.38);color:var(--blue-hi)}
.ichip{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--neu-t);background:var(--neu-f);border:1px solid var(--neu-b);white-space:nowrap}
.ichip.ok{color:var(--ok-t);background:var(--ok-f);border-color:var(--ok-b)}
.icard h3{font-size:21px;font-weight:700;letter-spacing:-.015em}
.icard .idesc{font-size:13.5px;color:var(--t3);line-height:1.6;margin-top:-6px}
.ic-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px}
.ic-foot .l{font-size:13px;color:var(--t3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{height:40px;padding:0 18px;font-weight:700}
.divl{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--t3);margin:6px 0 2px}
.divl::before,.divl::after{content:"";flex:1;border-top:1px dashed rgba(255,255,255,.14)}
.srcbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px 12px 20px;border-radius:22px}
.srcbar>svg{color:var(--t3)}
.srcbar .k{font-size:13.5px;font-weight:700}
.srcbar .opts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sopt{height:34px;padding:0 15px;border-radius:11px;font-size:12.5px;font-weight:650;color:var(--t3);background:rgba(255,255,255,.04);border:1px solid var(--line-soft);transition:all .18s ease}
.sopt:hover{color:#fff;background:rgba(255,255,255,.1)}
.sopt.on{color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.34)}
.sopt.on.t-Shopify{color:#d9f08f;background:rgba(149,191,71,.2);border-color:rgba(149,191,71,.55)}
.sopt.on.t-WooCommerce{color:#e0cbff;background:rgba(127,84,179,.24);border-color:rgba(158,115,214,.6)}
.sopt.on.t-CSV{color:var(--info-t);background:var(--info-f);border-color:var(--info-b)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#08090b;animation:spin .7s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.dlg .body.flow{display:flex;flex-direction:column;gap:14px}
.dlg .kvr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.dlg .kvr:last-child{border-bottom:0}
.dlg .kvr span:first-child{color:var(--t3)}
.dlg .kvr span:last-child{font-weight:650;text-align:right}
.code{font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--blue-ice);padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.5);border:1px solid var(--line);box-shadow:var(--sh-sunk);white-space:pre-wrap;word-break:break-all;margin:0}

/* ---------- responsive: inbox + integrations ---------- */
@media (max-width:1180px){
  .ib{grid-template-columns:minmax(250px,29%) minmax(0,1fr) minmax(250px,25%)}
  .int-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mrow{max-width:90%}
}
@media (max-width:900px){
  .content.fill{display:block;overflow:auto}
  .view.fill{height:auto;flex:none;padding:16px 16px 48px}
  .ib{display:flex;flex-direction:column;overflow:visible;flex:none}
  .ib-col{border-right:0!important;border-bottom:1px solid var(--line-soft)}
  .ib-list .ib-convs{max-height:380px}
  .ib-chat{height:640px}
  .ib-side{overflow:visible}
  .aud{min-width:0;width:100%}
}
@media (max-width:700px){
  .int-grid{grid-template-columns:minmax(0,1fr)}
  .srcbar .opts{margin-left:0}
  .copilot{margin-left:0}
}
</style>

function deepMerge(base, over){
  for (const k in over){
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) deepMerge(base[k], over[k]);
    else base[k] = over[k];
  }
  return base;
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD = iso => { const p = iso.split('-'); return `${MONTHS[+p[1] - 1]} ${+p[2]}`; };
const usd = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const IB = { menu:false, sku:false, tpl:false };   /* transient popover state */
const ibConv = () => S.inbox.convs.find(c => c.id === S.inbox.sel) || null;
const ibLast = c => { const m = c.msgs[c.msgs.length - 1]; return m ? (m.voice ? 'Voice message' : m.text) : ''; };

function ibMatch(c, f){
  const live = !c.archived && !c.spam;
  switch (f){
    case 'all':        return live;
    case 'unread':     return live && !!c.unread;
    case 'unresolved': return live && c.status === 'unresolved';
    case 'resolved':   return live && c.status === 'resolved';
    case 'complaints': return live && !!c.complaint;
    case 'archived':   return !!c.archived && !c.spam;
    case 'spam':       return !!c.spam;
    default:           return live && c.ch === f;
  }
}
function ibVisible(){
  const q = (S.inbox.q || '').trim().toLowerCase();
  let list = S.inbox.convs.filter(c => ibMatch(c, S.inbox.filter));
  if (q) list = list.filter(c => `${c.name} ${ibLast(c)} ${c.ch}`.toLowerCase().includes(q));
  return list.sort((a, b) => b.ts.localeCompare(a.ts));
}
const ibAv = (c, s = 42) => {

const ibItem = c => {

function ibAud(m){

function dateLabels(n){

  return out;
}

/* ============================================================
   Router + render
   ============================================================ */
const isMobile = () => matchMedia('(max-width:900px)').matches;
function render(keepScroll){
  const c = $('#content'), top = c.scrollTop;
  renderSidebar();
  renderTopbar();
  setLights();
  const view = $('#view');
  c.classList.toggle('fill', S.page === 'inbox');
  view.className = 'view' + (S.page === 'inbox' ? ' fill' : S.page === 'integrations' ? ' wide' : '');
  view.innerHTML = (R[S.page] || R.overview)();
  if (keepScroll) { view.style.animation = 'none'; c.scrollTop = top; } else { view.style.animation = ''; c.scrollTop = 0; }
  renderOnboard();
  if (S.page === 'inbox') ibPost();
  document.title = `${pageName(S.page) || 'Overview'} · Remlin`;
  save();
}
function renderOnboard(){
  const show = !S.onboardDismissed && ['orders','feedback'].includes(S.page);
  $('#layer').querySelector('.onboard')?.remove();
  if (!show) return;
  const el = document.createElement('div');
  el.className = 'card banner onboard';
  el.innerHTML = `<p style="font-size:14px;font-weight:600">First time here? A 1 min video shows how this works.</p>
    <div class="row" style="gap:10px"><button class="btn blue sm" data-act="noop" data-msg="The 1 min walkthrough video opens here">${ic('play', 14)}Watch</button><button class="btn glass sm" data-act="dismissOnboard">Don’t need it</button></div>`;
  $('#layer').appendChild(el);
}
function route(){
  const [id, sub, focus] = location.hash.replace('#', '').split('/');
  S.page = pageName(id) ? id : (pageName(S.page) ? S.page : 'overview');
  if (S.page === 'setup'){
    if (STEPS.some(s => s[0] === sub)) S.setupStep = sub;
    else if (!sub){ const d = stepDone(G()); S.setupStep = (STEPS.find(s => !d[s[0]]) || STEPS[0])[0]; }
  }
  if (S.page !== 'device' && S.page !== 'team' && S.page !== 'setup') S.fromGuide = null;
  if (S.page !== 'inbox') S.inbox.q = '';
  IB.menu = IB.sku = IB.tpl = false;
  $('#app').classList.remove('mobile-open');
  render(false);
  if (focus){
    const el = document.getElementById('biz-' + focus);
    if (el){ el.scrollIntoView({ block:'center' }); el.classList.add('flash'); el.querySelector('textarea,input')?.focus({ preventScroll:true }); setTimeout(() => el.classList.remove('flash'), 1800); }
  }
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => renderSidebar());

/* ============================================================
   Interactions
   ============================================================ */
const getPath = p => p.split('.').reduce((o, k) => o[k], S);
const setPath = (p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((o, k) => o[k], S)[last] = v; };

const ACTIONS = {
  set(el){ setPath(el.dataset.key, el.dataset.val); render(true); },
  toggle(el){ setPath(el.dataset.key, !getPath(el.dataset.key)); render(true); },
  go(el){ location.hash = el.dataset.page; },
  noop(el){ toast(el.dataset.msg || 'Not wired in this prototype'); },
  collapse(){ S.collapsed = !S.collapsed; renderSidebar(); save(); },
  openMenu(){ $('#app').classList.add('mobile-open'); },
  closeMenu(){ $('#app').classList.remove('mobile-open'); },
  duty(){ S.onDuty = !S.onDuty; log('Dashboard', S.onDuty ? 'You went on duty — new chats can be handed to you' : 'You went off duty — the AI keeps every chat'); toast(S.onDuty ? 'You are on duty' : 'You are off duty', S.onDuty ? 'checkCircle' : 'bellOff'); render(true); },
  dismissOnboard(){ S.onboardDismissed = true; renderOnboard(); save(); },
  ovRow(el){ const id = el.dataset.id; S.ov.open = S.ov.open === id ? null : id; render(true); },
  guideGo(el){ S.fromGuide = el.dataset.from || null; location.hash = el.dataset.to; },
  backToGuide(){ S.ov.open = S.fromGuide; if (['team','courier'].includes(S.fromGuide)) S.ov.after = true; S.fromGuide = null; location.hash = 'overview'; },
  closeGuideBanner(){ S.fromGuide = null; render(true); },
  skip(el){ S.setup[el.dataset.key] = true; log('Dashboard', el.dataset.key === 'teamSkipped' ? 'Setup: you answer chats yourself — Your team hidden' : 'Setup: you book parcels yourself — courier hidden'); render(true); },
  unskip(el){ S.setup[el.dataset.key] = false; render(true); },
  copy(el){
    const t = el.dataset.text;
    (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast(`Copied: ${t}`, 'copy'), () => toast(t, 'copy'));
  },

  /* wizard */
  stepNext(){ const i = STEPS.findIndex(s => s[0] === S.setupStep); location.hash = STEPS[i + 1] ? 'setup/' + STEPS[i + 1][0] : 'overview'; },
  fbConnect(){
    S.setup.connecting = true; render(true);
    setTimeout(() => {
      S.setup.connecting = false; S.ov.connected = true;
      log('Dashboard', `Facebook page “Remlin” connected${S.setup.ig ? ' with Instagram' : ''}`);
      toast('Page connected — messages now arrive', 'checkCircle');
      if (S.page === 'setup') render(true); else save();
    }, 1400);
  },
  fbDisconnect(){ S.ov.connected = false; S.setup.checked = false; S.setup.live = false; log('Dashboard', 'Facebook page “Remlin” disconnected'); render(true); },
  fbLink(){ const v = S.setup.fbLink.trim(); if (!/facebook\.com\/./i.test(v)) { toast('Paste your own profile link — facebook.com/your.name', 'alert'); return; } toast('Invitation sent to that profile', 'send'); log('Dashboard', 'Facebook tester invitation requested'); },
  fillForm(){
    const b = S.setup.biz, said = S.setup.say.trim();
    if (!said){ toast('Say or type a few lines first', 'mic'); return; }
    const take = (re) => (said.match(re) || [])[1];
    b.sell ||= take(/sell ([^.]+)/i) || 'Women’s clothing';
    b.hours ||= take(/open ([^.]+)/i) || '10am–8pm, Sat–Thu';
    const nums = said.match(/\d{2,4}/g) || [];
    b.inC ||= nums[0] || '70'; b.outC ||= nums[1] || '130';
    b.inF ||= '1'; b.inS ||= '2'; b.outF ||= '3'; b.outS ||= '5';
    b.hotline ||= (said.match(/01\d{9}/) || [''])[0];
    toast('Filled from what you said — check the boxes and save', 'wand'); render(true);
  },
  dayToggle(el){ const d = el.dataset.day, off = S.setup.biz.off; S.setup.biz.off = off.includes(d) ? off.filter(x => x !== d) : [...off, d]; render(true); },
  bizSave(){
    const b = S.setup.biz;
    if (!b.name.trim()){ toast('Your business needs a name', 'alert'); return; }
    S.setup.businessSaved = true; S.desk.name = b.name; if (b.hours) S.desk.hours = b.hours;
    log('Dashboard', 'Setup: “Your business” saved'); toast('Saved', 'checkCircle');
    location.hash = 'setup/products';
  },
  courierSave(){
    const s = S.setup;
    if (s.courier === 'self'){ ACTIONS.courierSkip(); return; }
    const need = s.courier === 'pathao' ? ['a','b','c'] : ['a','b'];
    if (need.some(k => !s.keys[k].trim())){ toast('Paste every key first', 'alert'); return; }
    s.courierSaved = true; s.courierSkipped = false;
    log('Dashboard', `Courier connected: ${s.courier === 'pathao' ? 'Pathao' : 'Steadfast'}`); toast('Courier connected', 'truck');
    location.hash = 'setup/team';
  },
  courierSkip(){ S.setup.courierSkipped = true; S.setup.courierSaved = false; S.setup.courier = 'self'; log('Dashboard', 'Setup: you book parcels yourself'); location.hash = 'setup/team'; },
  teamSkip(){ S.setup.teamSkipped = true; log('Dashboard', 'Setup: you answer chats yourself'); location.hash = 'setup/golive'; },
  runCheck(){
    S.setup.checking = true; render(true);
    setTimeout(() => { S.setup.checking = false; S.setup.checked = true; log('AI', 'Assistant check passed — 3 of 3 questions answered'); if (S.page === 'setup') render(true); else save(); }, 1600);
  },
  goLive(){
    const g = G();
    if (!(g.fb && g.business && g.check)){ toast('Finish the needed steps first', 'lock'); return; }
    S.setup.live = true; log('Dashboard', 'Remlin went live — the assistant now answers every customer');
    toast('You are live', 'rocket'); render(true);
  },

  /* this device */
  notifOn(){
    const done = () => { S.setup.devNotif = true; log('Dashboard', 'Alerts turned on for this device'); toast('Alerts are on for this device', 'bell'); render(true); };
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().finally(done); else done(); } catch (e) { done(); }
  },
  notifOff(){ S.setup.devNotif = false; log('Dashboard', 'Alerts turned off for this device'); render(true); },
  notifTest(){
    try { if ('Notification' in window && Notification.permission === 'granted'){ new Notification('Remlin', { body:'This is a test — alerts work on this device.' }); return; } } catch (e) {}
    toast('Test alert: a chat needs a person', 'bell');
  },
  soundToggle(){ S.setup.devSound = !S.setup.devSound; if (S.setup.devSound) ACTIONS.ping(); render(true); },
  ping(){
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 880; o.type = 'sine'; g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(.25, a.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .35);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .4);
      navigator.vibrate?.(80);
    } catch (e) {}
  },

  /* team */
  invite(el){ openForm('invite', { group:el.dataset.group || 'Agents' }); },
  removeMember(el){ const m = S.team.members.splice(+el.dataset.i, 1)[0]; S.team.log.unshift({ t:Date.now(), text:`Removed ${m.name}` }); log('Dashboard', `Teammate removed: ${m.name}`); render(true); },

  prodFeature(el){ const p = S.products.list.find(x => x.sku === el.dataset.sku); p.featured = !p.featured; log('Dashboard', `${p.name} ${p.featured ? 'featured' : 'unfeatured'}`); render(true); },

  },

/* ---------- generic dialog (reuses the modal look) ---------- */
function openDialog({ title, body = '', foot = [] }){
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `
    <div class="card modal dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="card-head"><span class="h2">${esc(title)}</span><button type="button" class="icon-btn" data-act="closeModal" aria-label="Close">${ic('x', 18)}</button></div>
      <div class="body flow">${body}</div>
      ${foot.length ? '<div class="foot"></div>' : ''}
    </div>`;
  const f = scrim.querySelector('.foot');
  foot.forEach(b => {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'btn ' + (b.cls || 'ghost'); el.innerHTML = b.label;
    el.addEventListener('click', () => { if (b.fn?.(scrim) !== false) scrim.remove(); });
    f.appendChild(el);
  });
  scrim.addEventListener('click', e => { if (e.target === scrim) scrim.remove(); });
  $('#layer').appendChild(scrim);
  setTimeout(() => scrim.querySelector('input')?.focus(), 30);
  return scrim;
}

/* ---------- inbox plumbing ---------- */
function ibMount(o = {}){
  vpStop();
  const q = s => document.querySelector(s);
  const prev = { l:q('.ib-convs')?.scrollTop || 0, m:q('.ib-msgs')?.scrollTop || 0, s:q('.ib-side')?.scrollTop || 0, f:q('.ib-filters')?.scrollLeft || 0 };
  $('#view').innerHTML = R.inbox();
  if (q('.ib-convs'))   q('.ib-convs').scrollTop = o.listTop ? 0 : prev.l;
  if (q('.ib-msgs'))    q('.ib-msgs').scrollTop = o.bottom ? 1e9 : prev.m;
  if (q('.ib-side'))    q('.ib-side').scrollTop = o.bottom ? 0 : prev.s;
  if (q('.ib-filters')) q('.ib-filters').scrollLeft = prev.f;
  ibPops();
  if (o.reveal) ibReveal();
  if (o.focus){ const i = $('#ibInput'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  if (o.toChat && isMobile()) q('.ib-chat')?.scrollIntoView({ behavior:'smooth', block:'start' });
  save();
}
function ibReveal(){
  const box = $('.ib-convs'), on = $('.cv.on');
  if (!box || !on) return;
  if (on.offsetTop < box.scrollTop || on.offsetTop + on.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = Math.max(0, on.offsetTop - 10);
}
function ibPost(){ const m = $('.ib-msgs'); if (m) m.scrollTop = m.scrollHeight; ibReveal(); }
function ibPops(){
  const set = (s, on) => { const el = document.querySelector(s); if (el) el.hidden = !on; };
  set('.pop.menu', IB.menu); set('.pop.sku', IB.sku); set('.pop.tpl', IB.tpl);
  document.querySelectorAll('[data-pop]').forEach(b => b.setAttribute('aria-expanded', String((b.dataset.act === 'ibMenu' && IB.menu) || (b.dataset.act === 'ibSku' && IB.sku))));
}
function ibCloseAll(){ IB.menu = IB.sku = IB.tpl = false; ibPops(); }
function ibListRefresh(){
  const list = ibVisible(), box = $('.ib-convs');
  if (!box) return;
  box.innerHTML = ibListHtml(list);
  const n = $('.ib-list .ib-count'); if (n) n.textContent = list.length;
}
function ibTpl(){
  const c = ibConv(), el = $('.pop.tpl');
  if (!c || !el) return;
  const v = S.inbox.drafts[c.id] || '', open = v.startsWith('/');
  IB.tpl = open;
  if (open){
    const q = v.slice(1).toLowerCase();
    const hits = IB_TPL.filter(t => t[0].slice(1).startsWith(q) || t[1].toLowerCase().includes(q));
    el.innerHTML = hits.length
      ? hits.map(t => `<button class="pi" role="option" data-act="ibTplPick" data-t="${esc(t[2])}"><b>${t[0]}</b><span>${esc(t[1])}</span></button>`).join('')
      : `<div class="pi-empty">No template matches “${esc(q)}”</div>`;
  }
  el.hidden = !open;
}
function ibStep(d){
  const list = ibVisible(), i = list.findIndex(x => x.id === S.inbox.sel), n = list[i + d];
  if (n) ACTIONS.ibOpen({ dataset:{ id:n.id } });
}
const ibRef = () => Array.from({ length:8 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789'[Math.floor(Math.random() * 34)]).join('');
const ibToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };

/* ---------- voice message player (simulated playback) ---------- */
const VP = { id:null, t:0, dur:0, timer:null };
const vpFmt = s => `${Math.floor(s / 60)}:${pad2(Math.floor(s % 60))}`;
function vpPaint(){
  document.querySelectorAll('.aud').forEach(a => {
    const on = a.dataset.vid === VP.id, dur = +a.dataset.dur, t = on ? VP.t : 0, pct = dur ? Math.min(100, t / dur * 100) : 0;
    a.querySelector('.aud-tr i').style.width = pct + '%';
    a.querySelector('.aud-tr b').style.left = `calc(${pct}% - ${pct * .12}px)`;
    a.querySelector('.aud-t').innerHTML = `<b>${vpFmt(t)}</b> / ${vpFmt(dur)}`;
    a.querySelector('.aud-b').innerHTML = ic(on ? 'pause' : 'tri', 16);
  });
}
function vpStop(){ clearInterval(VP.timer); VP.id = null; VP.t = 0; VP.timer = null; vpPaint(); }

document.addEventListener('click', e => {

  const el = e.target.closest('[data-act]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACTIONS[el.dataset.act];
  if (fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'ibInput'){ const c = ibConv(); if (c){ S.inbox.drafts[c.id] = el.value; ibTpl(); } return; }
  if (el.id === 'globalSearch' && S.page === 'inbox'){ S.inbox.q = el.value; ibListRefresh(); return; }
  if (el.dataset.bind){
    setPath(el.dataset.bind, el.value);
    if (el.tagName === 'INPUT' && /^(orders|products)\.q$/.test(el.dataset.bind)){ const pos = el.selectionStart; render(true); const n = $('#pageSearch'); n.focus(); n.setSelectionRange(pos, pos); }
    else save();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind && el.tagName === 'SELECT'){ setPath(el.dataset.bind, el.value); render(true); }
  if (el.dataset.bindCheck){ setPath(el.dataset.bindCheck, el.checked); render(true); }
  if (el.dataset.member){
    const m = S.team.members[+el.dataset.member];
    S.team.log.unshift({ t:Date.now(), text:`${m.name} moved from ${m.group} to ${el.value}` }); m.group = el.value; render(true);
  }
  if (el.dataset.order){
    const o = S.orders.list.find(x => x.ref === el.dataset.order);
    log('Dashboard', `${o.ref} moved from ${o.status} to ${el.value}`);
    o.status = el.value; render(true);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'search' && S.page !== 'inbox'){ const q = $('#globalSearch').value.trim(); if (q) toast(`Search for “${q}” runs on the live console`, 'search'); }
});
document.addEventListener('keydown', e => {
  if (S.page === 'inbox'){
    if (e.target.id === 'ibInput' && e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); ACTIONS.ibSend(); return; }
    if (!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !$('#layer .scrim')){ e.preventDefault(); ibStep(e.key === 'ArrowDown' ? 1 : -1); return; }
  }
  if (e.key === 'Escape'){ ACTIONS.closeModal(); ACTIONS.closeMenu(); if (IB.menu || IB.sku || IB.tpl) ibCloseAll(); }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault(); ($('#pageSearch') || $('#globalSearch'))?.focus();
  }
  if ((e.key === 'Enter') && (e.metaKey || e.ctrlKey)){
    if (document.activeElement.id === 'deskDraft') ACTIONS.deskSend();
    if (document.activeElement.id === 'fbText') ACTIONS.fbSend();
  }
});

/* ---------- forms (new order / product) ---------- */
function openForm(kind, opts = {}){
  const isO = kind === 'order', isI = kind === 'invite';
  const fields = isI
    ? [['name','Name','text','e.g. Rina Akter','full'],['email','Email','email','name@example.com','full'],['group','Group','select',[opts.group, ...['Agents','Managers','Owners'].filter(x => x !== opts.group)],'full']]
    : isO
    ? [['customer','Customer name','text','e.g. Nusrat Jahan',''],['phone','Phone','tel','01XXXXXXXXX',''],['items','Items','text','e.g. 2 × Cotton kurti (M)','full'],['address','Delivery address','text','House, road, area, city','full'],['total','Total (BDT)','number','1250',''],['source','Source','select',['Messenger','Instagram','Website chat','Store'],'']]
    : [['name','Product name','text','e.g. Cotton kurti','full'],['sku','Code (SKU)','text','e.g. KRT-014',''],['cat','Category','text','e.g. Kurti',''],['price','Price (BDT)','number','1250',''],['stock','Stock','number','12','']];
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `
    <form class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <div class="card-head"><span class="h2" id="mt">${isI ? (opts.group === 'Owners' ? 'Add an owner' : 'Invite teammate') : isO ? 'New order' : 'Add product'}</span><button type="button" class="icon-btn" data-act="closeModal" aria-label="Close">${ic('x', 18)}</button></div>
      <div class="body">
        ${fields.map(([k, l, t, ph, cls]) => `<label class="lbl ${cls}">${l}<div class="field">${t === 'select'
          ? `<select name="${k}">${ph.map(o => `<option>${o}</option>`).join('')}</select>${ic('chevD', 14)}`
          : `<input name="${k}" type="${t}" placeholder="${ph}" ${t === 'number' ? 'min="0"' : ''} required>`}</div></label>`).join('')}
        ${isO ? `<label class="check full"><input type="checkbox" name="test">Mark as a test order</label>` : ''}
      </div>
      <div class="foot"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button type="submit" class="btn blue">${ic(isI ? 'send' : 'plus', 15, 2.2)}${isI ? 'Send invitation' : isO ? 'Create order' : 'Add product'}</button></div>
    </form>`;
  scrim.addEventListener('click', e => { if (e.target === scrim) scrim.remove(); });
  scrim.querySelector('form').addEventListener('submit', e => {
    e.preventDefault(); e.stopPropagation();
    const f = Object.fromEntries(new FormData(e.target));
    if (isI){
      if (S.team.members.some(m => m.email.toLowerCase() === f.email.toLowerCase())){ toast('That email is already invited', 'alert'); return; }
      S.team.members.push({ name:f.name, email:f.email, group:f.group, status:'Invited', t:Date.now() });
      S.team.log.unshift({ t:Date.now(), text:`Invited ${f.name} (${f.email}) to ${f.group}` });
      log('Dashboard', `Teammate invited: ${f.name}`); toast(`Invitation sent to ${f.email}`, 'send');
    } else if (isO){
      const ref = `#ORD-${++S.orders.seq}`;
      S.orders.list.unshift({ ref, customer:f.customer, phone:f.phone, items:f.items, address:f.address, total:+f.total, source:f.source, status:'Pending', test:!!f.test, t:Date.now() });
      S.orders.status = 'All'; if (f.test) S.orders.test = true;
      log('Dashboard', `${ref} created for ${f.customer}`); toast(`${ref} created`, 'checkCircle');
    } else {
      if (S.products.list.some(x => x.sku === f.sku)){ toast('That code is already in the catalog', 'alert'); return; }
      const p = { name:f.name, sku:f.sku, cat:f.cat, price:+f.price, stock:+f.stock, ai:'Pending', featured:false, hidden:false };
      S.products.list.unshift(p); S.products.tab = 'Catalog';
      log('Dashboard', `Product “${p.name}” added`); toast('Product added — indexing', 'package');
      setTimeout(() => { p.ai = 'Trained'; log('AI', `Product “${p.name}” indexed — the AI can now recognise it`); if (['products','setup'].includes(S.page)) render(true); else save(); }, 2200);
    }
    scrim.remove(); render(true);
  });
  $('#layer').appendChild(scrim);
  setTimeout(() => scrim.querySelector('input')?.focus(), 30);
}
function download(name, rows){
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500);
  toast(`${name} downloaded`, 'download');
}

/* products that were mid-index when the page closed finish now */
S.products.list.forEach(p => { if (p.ai === 'Pending') p.ai = 'Trained'; });
S.setup.connecting = false; S.setup.checking = false;
S.inbox.q = ''; S.integ.busy = null;
if (!S.inbox.convs.some(c => c.id === S.inbox.sel)) S.inbox.sel = S.inbox.convs[0]?.id || null;
/* auto-collapse to the rail on mid-size screens on first load */
let firstVisit = true;
try { firstVisit = !localStorage.getItem('remlin-proto-v1'); } catch (e) {}
if (firstVisit && matchMedia('(max-width:1240px) and (min-width:901px)').matches) S.collapsed = true;
route();
</script>
